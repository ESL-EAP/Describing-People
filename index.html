var hasTTS='speechSynthesis' in window;
function speak(text,btn){
  if(!hasTTS){alertBox(btn,text);return}
  try{var vs=speechSynthesis.getVoices();if(vs.length&&!vs.some(function(v){return /^en/i.test(v.lang)})){alertBox(btn,text);return}}catch(e){}

    speechSynthesis.speak(u);

}

{t:'Task 3 · Describing people',draw:function(m){

      (S.tp===C.length-1?'<p class="note">Describe what you can <b>see</b>. Be kind — don’t judge someone’s body or looks.</p>':'')+
    '</div></div>';

    $$('[data-slug]',m).forEach(function(b){b.onclick=function(){wordPop(b.dataset.slug)}});
    $$('[data-tp]',m).forEach(function(b){b.onclick=function(){S.tp=+b.dataset.tp;save();d()}});
  }

{t:'Task 3 · Pronunciation',draw:function(m){
  var W=[['wearing','WAIR-ing','She is wearing a jacket.'],['moustache','MUS-tash','He has a moustache.'],['curly','KUR-lee','She has curly hair.'],['sweater','SWET-er','He is wearing a sweater.'],['straight','STRAYT','She has straight hair.'],['glasses','GLASS-iz','He has glasses.'],['striped','STRYPT','They are wearing a striped shirt.'],['beard','BEERD','He has a beard.']];
  m.innerHTML='<h2>Say it clearly</h2><p class="lead">Listen to the word. Record yourself. Then press <b>Compare</b> to hear the model and your voice.</p><div class="prgrid">'+W.map(function(w,i){return '<div class="card pr" data-pr="'+i+'"><div><span class="w">'+w[0]+'</span> <span class="sy">'+w[1]+'</span></div><p class="small">'+esc(w[2])+'</p><div class="row"><button type="button" class="btn ghost sm" data-pl>'+PLAY+'Listen</button><button type="button" class="btn ghost sm" data-prc>'+MIC+'<span>Record</span></button></div><div class="row" data-mine hidden><button type="button" class="btn ghost sm" data-pm>My voice</button><button type="button" class="btn sm" data-cmp>Compare</button></div><span class="heard small" aria-live="polite"></span></div>'}).join('')+'</div><p class="small">Tip: say the word slowly first, then at normal speed. The <b>Slow audio</b> button at the top makes the model slower.</p>';
  $$('[data-pr]',m).forEach(function(card){var i=+card.dataset.pr,w=W[i],key='pr_'+w[0],hd=$('.heard',card),mine=$('[data-mine]',card),rb=$('[data-prc]',card);
    function showMine(){mine.hidden=!REC[key]}
    showMine();
    $('[data-pl]',card).onclick=function(){speak(w[0],this)};
    function playMine(cb){var r=REC[key];if(!r)return;var au=new Audio(r.url);au.playbackRate=1;au.onended=cb||null;au.play().catch(function(){})}
    $('[data-pm]',card).onclick=function(){playMine()};
    $('[data-cmp]',card).onclick=function(){if(!hasTTS){playMine();return}try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(w[0]);u.lang='en-CA';u.rate=S.slow?.6:.85;u.onend=function(){setTimeout(function(){playMine()},400)};speechSynthesis.speak(u)}catch(e){playMine()}};
    rb.onclick=function(){if(card._rec){card._rec.stop();return}
      if(!navigator.mediaDevices||!window.MediaRecorder){hd.textContent='Recording is not available in this browser.';return}
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){var chunks=[],mr=new MediaRecorder(stream),sr=null,got='';
        mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
        mr.onstop=function(){stream.getTracks().forEach(function(t){t.stop()});var type=mr.mimeType||'audio/webm',bl=new Blob(chunks,{type:type});if(REC[key])URL.revokeObjectURL(REC[key].url);REC[key]={url:URL.createObjectURL(bl),type:type,blob:bl};idbPut(key,bl,type);
          if(sr)try{sr.stop()}catch(e){}card._rec=null;rb.classList.remove('rec-on');$('span',rb).textContent='Record again';showMine();
          setTimeout(function(){var ok=norm(got).indexOf(' '+w[0])>-1;hd.innerHTML=got?(ok?'<b style="color:var(--good)">Clear! We heard “'+esc(got.trim())+'”.</b>':'We heard “'+esc(got.trim())+'”. Listen to the model and try again.'):(SR?'Press <b>Compare</b> to check your voice.':'Press <b>Compare</b> to check your voice.')},600)};
        if(SR){try{sr=new SR();sr.lang='en-CA';sr.interimResults=false;sr.maxAlternatives=3;sr.onresult=function(e){var r=e.results[0];got=r[0].transcript;for(var k=0;k<r.length;k++){if(norm(r[k].transcript).indexOf(' '+w[0])>-1){got=r[k].transcript;break}}};sr.onerror=function(){};sr.start()}catch(e){sr=null}}
        mr.start();card._rec=mr;rb.classList.add('rec-on');$('span',rb).textContent='Stop';hd.textContent='Say: '+w[0];
        setTimeout(function(){if(card._rec===mr)mr.stop()},4000);
      },function(){hd.textContent='The microphone is blocked. Allow the microphone in your browser.'})};
  });}},

{t:'Task 3 · Describing people',draw:function(m){
  m.innerHTML='<h2>has, is, or is wearing?</h2><div class="grid3"><div class="card"><p><b>has</b> + thing</p><p class="small">hair, eyes, glasses, a beard</p><p class="small">She <b>has</b> curly hair.<br>He <b>has</b> blue eyes.</p></div><div class="card"><p><b>is</b> + adjective</p><p class="small">tall, tired, happy, friendly</p><p class="small">He <b>is</b> tall.<br>She <b>is</b> tired.</p></div><div class="card"><p><b>is wearing</b> + clothes</p><p class="small">a jacket, a sweater, a scarf</p><p class="small">She <b>is wearing</b> a green sweater.</p></div></div><p class="note"><b>Tip:</b> A noun next (<i>hair, eyes, a beard</i>)? Use <b>has</b>. Only an adjective next (<i>tall, tired</i>)? Use <b>is</b>.<br><b>Glasses:</b> both are correct — <i>He has glasses.</i> / <i>He is wearing glasses.</i></p><div class="phr"><b>Useful words</b><b style="display:inline">has:</b> long · short · curly · straight · wavy hair · brown eyes · glasses · a beard<br><b style="display:inline">is:</b> tall · tired · happy<br><b style="display:inline">is wearing:</b> a jacket · a sweater · a shirt · a scarf · striped</div><div id="hw"></div>';
  quiz('hw3',HASW,function(q,i){var a=A[q[2]];return '<div class="card actorview" style="grid-template-columns:minmax(0,160px) minmax(0,1fr)"><img src="'+img(a)+'" alt="Photo of '+a.n+'"><div style="display:grid;gap:12px;align-content:center"><p class="sentence">'+esc(q[0]).replace('___','<span class="blank">?</span>')+'</p><div class="chips"><button type="button" class="chip" data-ans="has">has</button><button type="button" class="chip" data-ans="is">is</button><button type="button" class="chip" data-ans="is wearing">is wearing</button></div></div></div>'},
    function(q,a){if(q[1].indexOf(a)>-1){if(q[3]==='clothes')return {ok:true,msg:a==='has'?'Correct! You can also say “'+q[0].replace('___','is wearing')+'” We usually use <i>is wearing</i> for clothes someone has on now.':'Correct: '+q[0].replace('___',a)};
        return {ok:true,msg:'Correct: '+q[0].replace('___',a)+(q[1].length>1?' (“'+q[0].replace('___',q[1].filter(function(x){return x!==a})[0])+'” is also correct.)':'')}}
      var why=a==='is'?(q[3]==='clothes'?'For clothes, use <b>is wearing</b>: “'+q[0].replace('___','is wearing')+'”':'After “is” we need an adjective (tall, happy). Here a noun comes next.'):(a==='has'?(q[1][0]==='is'?'“happy” is an adjective, so use “is”.':'Clothes → is wearing.'):(q[1][0]==='is'?'“happy” is an adjective, so use “is”.':'Hair, eyes, a beard → has.'));
      return {ok:false,msg:'Not quite. '+why}})($('#hw'));}},

{t:'Task 3 · Describing people',draw:function(m){
  S.bi=S.bi||0;S.bd=S.bd||{};
  function d(){var idx=S.bi,a=A[BUILD[idx]],ans=S.bd[idx]||{};
    var opts={len:['long','short'],tex:['curly','straight','wavy'],gl:['and glasses','(no glasses)'],wear:['a green jacket','a blue sweater','a black jacket','a striped shirt','a red jacket','a yellow scarf']};
    function row(k,label){return '<div style="display:grid;gap:6px"><p class="small"><b>'+label+'</b></p><div class="chips">'+opts[k].map(function(o){return '<button type="button" class="chip" data-b="'+k+'" data-v="'+o+'" aria-pressed="'+(ans[k]===o)+'">'+o+'</button>'}).join('')+'</div></div>'}
    m.innerHTML='<h2>Look and describe</h2><p class="lead">Build a description of each person. Then say it aloud.</p><div class="dots" role="group" aria-label="People">'+BUILD.map(function(_,k){return '<button type="button" class="dot '+(S.bd[k]&&S.bd[k].ok?'ok':(k===idx?'on':''))+'" data-bj="'+k+'" aria-label="Person '+(k+1)+'"'+(k===idx?' aria-current="step"':'')+'>'+(k+1)+'</button>'}).join('')+'</div>'+
    '<div class="card actorview"><img src="'+img(a)+'" alt="Photo of '+a.n+'"><div style="display:grid;gap:14px"><p class="sentence">'+a.n+' has <span class="blank">'+esc(ans.len||'___')+'</span>, <span class="blank">'+esc(ans.tex||'___')+'</span> hair <span class="blank">'+esc(ans.gl==='and glasses'?'and glasses':(ans.gl?'—':'___'))+'</span>.<br>'+a.n+' is wearing <span class="blank">'+esc(ans.wear||'___')+'</span>.</p>'+row('len','Hair length')+row('tex','Hair type')+row('gl','Glasses?')+row('wear','Clothes')+'<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn" id="chk">Check</button><button type="button" class="btn ghost" id="hear">Hear my sentence</button></div><div id="bfb"></div>'+AB('say_'+idx,'Now say your description aloud (or type it)',a.n+' has … hair. '+a.n+' is wearing …','describe',BUILD[idx])+'</div></div>';
    $$('[data-b]',m).forEach(function(b){b.onclick=function(){ans[b.dataset.b]=b.dataset.v;ans.ok=false;S.bd[idx]=ans;save();d()}});
    function sent(){return a.n+' has '+(ans.len||'')+', '+(ans.tex||'')+' hair'+(ans.gl==='and glasses'?' and glasses':'')+'. '+a.n+' is wearing '+(ans.wear||'')+'.'}
    $('#hear').onclick=function(){speak(sent(),this)};
    $('#chk').onclick=function(){var wrong=[];if(ans.len!==a.len)wrong.push('hair length');if(a.tex.indexOf(ans.tex)<0)wrong.push('hair type');if((ans.gl==='and glasses')!==a.gl)wrong.push('glasses');if(ans.wear!==a.wear)wrong.push('clothes');
      if(!wrong.length){ans.ok=true;S.bd[idx]=ans;save();$('#bfb').innerHTML='<div class="fb good">Great description! Say it aloud: “'+esc(sent())+'”</div>'+(idx<BUILD.length-1?'<div style="margin-top:10px"><button class="btn" type="button" id="nb">Next person</button></div>':'<div class="fb good" style="margin-top:8px">You described all four people. Press Next.</div>');var nb=$('#nb');if(nb)nb.onclick=function(){S.bi++;save();d()};$$('.dot',m)[idx].className='dot ok'}
      else $('#bfb').innerHTML='<div class="fb bad">Look again at: '+wrong.join(', ')+'.</div>'};
    m.insertAdjacentHTML('beforeend','<div style="display:flex;gap:10px;flex-wrap:wrap">'+(idx>0?'<button type="button" class="btn ghost sm" id="pb">← Previous person</button>':'')+(idx<BUILD.length-1?'<button type="button" class="btn ghost sm" id="nb2">Next person →</button>':'')+'</div>');
    var pb=$('#pb'),nb2=$('#nb2');if(pb)pb.onclick=function(){S.bi--;save();d()};if(nb2)nb2.onclick=function(){S.bi++;save();d()};
    $$('[data-bj]',m).forEach(function(b){b.onclick=function(){S.bi=+b.dataset.bj;save();d()}});
    wireAB(m);bindInputs(m);
    if(ans.ok)$('#chk').click();
  }
  SUB={more:function(){return S.bi<BUILD.length-1},word:function(){return 'Next person'},next:function(){S.bi++;save();d();scrollTo(0,0)},canBack:function(){return S.bi>0},back:function(){S.bi--;save();d();scrollTo(0,0)}};
  d();}},

    m.innerHTML='<h2>Meet the actors</h2><p class="lead">Look, listen, and take notes. The actors do not say personality words — you decide!</p><div class="photos" style="grid-template-columns:repeat(7,minmax(0,1fr))">'+A.map(function(x,k){var done=S.at[x.n]&&S.at[x.n].tr.length;return '<button type="button" class="ph'+(k===S.ai?' sel':'')+'" data-a="'+k+'" aria-label="'+x.n+'"><img src="'+img(x)+'" alt="">'+(done?'<span>✓</span>':'')+'</button>'}).join('')+'</div>'+
    '<div class="card actorview"><img src="'+img(a)+'" alt="Photo of '+a.n+'"><div style="display:grid;gap:14px"><div><div class="small" style="font-weight:700;letter-spacing:.1em;text-transform:uppercase">Actor '+(S.ai+1)+' of 7</div><h2>'+a.n+'</h2></div><audio controls preload="none" id="aaud" src="audio/'+a.f+'_introduction.mp3"></audio><div><button type="button" class="btn ghost sm" id="trb"'+((S.heard||{})[a.n]?'':' hidden')+'>Show what they said</button><p class="small" id="trh"'+((S.heard||{})[a.n]?' hidden':'')+'>Listen to the end first. Then you can read what they said.</p><div class="card" id="trx" hidden style="background:var(--bg);margin-top:8px"><p>'+esc(ASCRIPT[a.n])+'</p></div></div>'+
    AB('see_'+a.n,'What do you see?','hair, glasses, clothes','see',a.n,60)+AB('do_'+a.n,'What do they do? (listen to the audio)','actions you hear','does',a.n,60)+'<div><div><p class="small" style="margin-bottom:6px"><b>Personality words</b> — tap one or more</p><div class="chips">'+TRAITS.map(function(w){return '<button type="button" class="chip" data-t="'+w+'" aria-pressed="'+(t.tr.indexOf(w)>-1)+'">'+w+'</button>'}).join('')+'</div></div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap">'+(S.ai>0?'<button type="button" class="btn ghost" id="pa">Previous actor</button>':'')+(S.ai<6?'<button type="button" class="btn" id="na">Next actor</button>':'<p class="fb good">All seven actors done? Press Next to cast the movie.</p>')+'</div></div></div>';
    if(t.see&&S['see_'+a.n]==null)S['see_'+a.n]=t.see;if(t.do&&S['do_'+a.n]==null)S['do_'+a.n]=t.do;bindInputs(m);wireAB(m);
    $$('[data-t]',m).forEach(function(b){b.onclick=function(){var w=b.dataset.t,k=t.tr.indexOf(w);if(k>-1)t.tr.splice(k,1);else t.tr.push(w);save();b.setAttribute('aria-pressed',k<0)}});
    $$('[data-a]',m).forEach(function(b){b.onclick=function(){S.ai=+b.dataset.a;save();d()}});
    $('#aaud').addEventListener('ended',function(){S.heard=S.heard||{};S.heard[a.n]=1;save();$('#trb').hidden=false;$('#trh').hidden=true});
    $('#trb').onclick=function(){var x=$('#trx');x.hidden=!x.hidden;this.textContent=x.hidden?'Show what they said':'Hide what they said'};
    var na=$('#na');if(na)na.onclick=function(){S.ai++;save();d();scrollTo(0,0)};var pa=$('#pa');if(pa)pa.onclick=function(){S.ai--;save();d();scrollTo(0,0)};
  }
  SUB={more:function(){return S.ai<A.length-1},word:function(){return 'Next actor'},next:function(){S.ai++;save();d();scrollTo(0,0)},canBack:function(){return S.ai>0},back:function(){S.ai--;save();d();scrollTo(0,0)}};
  d();}},

{t:'Task 4 · Cast the movie',draw:function(m){
  S.cast=S.cast||{};S.why=S.why||{};
  function d(){var used=Object.keys(S.cast).map(function(k){return S.cast[k]});
    var left=A.filter(function(a){return used.indexOf(a.n)<0}).map(function(a){return a.n});
    m.innerHTML='<h2>Cast the movie</h2><p class="lead">Tap one actor for each role. Give a reason from the audio.</p>'+ROLES.map(function(r,i){var c=S.cast[i];return '<div class="card role"><div class="rolehead">'+ICON[i]+'<div><b>'+r.r+'</b><p class="small">'+r.d+'</p></div></div><div class="thumbs">'+A.map(function(a){var u=used.indexOf(a.n)>-1&&c!==a.n;return '<button type="button" class="thumb'+(u?' used':'')+'" data-r="'+i+'" data-n="'+a.n+'" aria-pressed="'+(c===a.n)+'"><img src="'+img(a)+'" alt="">'+a.n+'</button>'}).join('')+'</div>'+(c?'<div><span class="fit '+fitOf(i,c)[0]+'">'+c+': '+fitOf(i,c)[1]+'</span></div>'+AB('why_'+i,'Why '+c+'? What did they say or do?',c+' fits because …','why',i,60):'')+'</div>'}).join('')+
    '<div class="card"><b>Not cast:</b> '+(used.length===5&&left.length===2?esc(left.join(' and ')):'<span class="small">Choose five different actors.</span>')+'</div>';
    $$('[data-r]',m).forEach(function(b){b.onclick=function(){var i=b.dataset.r;if(S.cast[i]===b.dataset.n)delete S.cast[i];else{Object.keys(S.cast).forEach(function(k){if(S.cast[k]===b.dataset.n)delete S.cast[k]});S.cast[i]=b.dataset.n}save();var y=scrollY;d();scrollTo(0,y)}});
    bindInputs(m);wireAB(m);
  }
  d();}},

{t:'Task 4 · Your pitch',draw:function(m){
  S.cast=S.cast||{};
  var lines=ROLES.map(function(r,i){return S.cast[i]?'<li><b>'+esc(S.cast[i])+'</b> as '+r.r+(S['why_'+i]?' — '+esc(S['why_'+i]):'')+'</li>':''}).join('');
  m.innerHTML='<h2>Present your cast</h2>'+(lines?'<div class="card"><ul style="margin:0;padding-left:20px;display:grid;gap:6px">'+lines+'</ul></div>':'<p class="note">Go back and cast the movie first.</p>')+
  '<div class="phr"><b>Pitch frames</b>We choose ___ for the role of ___ because ___. · They have ___ hair and are wearing ___. · In the introduction, they said they ___. · We think they seem ___ because ___. · We did not cast ___ because ___.</div><div class="card">'+AB('pitch','Our pitch — say it or write it','We choose … for the role of … because …','pitch',null,130)+'</div><div class="phr"><b>Discuss</b>I agree because… · I have a different choice because… · Which action shows that? · Another actor could fit because…</div>'+
  '<div class="card" style="display:grid;gap:10px"><h3>Finished?</h3><p>Copy your answers and paste them where your teacher asks. Then press <b>Next</b> to get your certificate.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="button" id="copy">Copy my answers</button><a class="btn ghost" href="handouts/Student_Activity_Packet.pdf" target="_blank" rel="noopener" style="text-decoration:none">Printable packet (PDF)</a></div><span id="cmsg" class="small" aria-live="polite"></span><textarea id="cout" hidden readonly style="min-height:180px"></textarea></div><p class="small">The actors, portraits, and audio are fictional and were created for this classroom activity.</p>';
  bindInputs(m);wireAB(m);
  $('#copy').onclick=function(){var L=['DESCRIBING PEOPLE — '+(S.name||'(no name)'),'','Task 1 · I notice '+(S.poll||'—')+' first.',S.t1notes?'Discussion: '+S.t1notes:'','','Task 2 score: '+score('t2q')+' / 6','About me: I am '+(S.meWord||'___')+' because I '+(S.meWhy||'___'),'','Task 3 · has/is/is wearing: '+score('hw3')+' / 6 · Find the person: '+score('find')+' / 6','','Actor notes:'];
    A.forEach(function(a){var t=(S.at||{})[a.n]||{tr:[]};L.push('- '+a.n+' | see: '+(S['see_'+a.n]||t.see||'')+' | does: '+(S['do_'+a.n]||t.do||'')+' | traits: '+t.tr.join(', '))});
    L.push('','Cast:');ROLES.forEach(function(r,i){L.push('- '+r.r+': '+(S.cast[i]||'—')+(S['why_'+i]?' ('+S['why_'+i]+')':''))});
    L.push('','Pitch: '+(S.pitch||''),'','Guess who: '+score('guess')+' / 5');var txt=L.join('\n'),o=$('#cout'),msg=$('#cmsg');o.value=txt;
    function fb(){o.hidden=false;o.focus();o.select();msg.textContent='Select all the text and copy it.'}
    try{navigator.clipboard.writeText(txt).then(function(){msg.textContent='Copied! Now paste it for your teacher.'},fb)}catch(e){fb()}};}},

{t:'Check yourself',draw:function(m){
  var C=['I can talk about first impressions.','I can use personality words (friendly, helpful, rude, impatient, quiet, talkative).','I can describe hair, face, and clothes with has and is wearing.','I can listen for actions and guess someone’s personality.','I can give a reason with because.'];
  S.can=S.can||{};var L=[['yes','Yes, I can'],['almost','Almost'],['not','Not yet']];
  function d(){m.innerHTML='<h2>What can you do now?</h2><p class="lead">Be honest. This helps you and your teacher.</p><div class="cando">'+C.map(function(c,i){return '<div class="card"><p><b>'+esc(c)+'</b></p><div class="chips">'+L.map(function(l){return '<button type="button" class="chip" data-cq="'+i+'" data-v="'+l[0]+'" aria-pressed="'+(S.can[i]===l[0])+'">'+l[1]+'</button>'}).join('')+'</div></div>'}).join('')+'</div>'+
    '<div class="card"><label for="ab_goal">One thing I want to practise more:</label><input type="text" id="ab_goal" data-k="goal" placeholder="Example: using is wearing"></div>';
    $$('[data-cq]',m).forEach(function(b){b.onclick=function(){S.can[b.dataset.cq]=b.dataset.v;save();var y=scrollY;d();scrollTo(0,y)}});bindInputs(m)}
  CANS=C;d();}},

{t:'Certificate',draw:function(m){
  var today=new Date().toLocaleDateString('en-CA',{year:'numeric',month:'long',day:'numeric'});
  if(!S.certDate)S.certDate=today;
  m.innerHTML='<h2>Certificate of completion</h2><p class="lead">Check your name and the date. Then download your certificate.</p><div class="grid2"><div><label for="cn">Your name</label><input type="text" id="cn" data-k="name"></div><div><label for="cd">Date</label><input type="text" id="cd" data-k="certDate"></div></div><div class="card" style="padding:10px"><img id="certImg" alt="Certificate of completion" style="width:100%;display:block;border-radius:8px"></div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><a class="btn" id="dl" download="Certificate_Describing_People.png" style="text-decoration:none">Download certificate</a><span class="small">If the button does not work, right-click (or press and hold) the certificate and choose <b>Save image</b>.</span></div><div class="card" style="display:grid;gap:10px"><h3>Download my work</h3><p>Save one file with all your answers, your scores, your recordings, and your certificate. Open it in any web browser, or send it to your teacher.</p><div><button type="button" class="btn" id="work">Download my work</button></div><span class="small" id="wmsg" aria-live="polite"></span></div>';
  bindInputs(m);
  function drawCert(){var c=document.createElement('canvas'),W=1600,H=1130;c.width=W;c.height=H;var x=c.getContext('2d');
    x.fillStyle='#fbfdfd';x.fillRect(0,0,W,H);
    x.strokeStyle='#087e8b';x.lineWidth=18;x.strokeRect(40,40,W-80,H-80);
    x.strokeStyle='#17324d';x.lineWidth=3;x.strokeRect(72,72,W-144,H-144);
    x.fillStyle='#17324d';x.fillRect(72,72,W-144,150);
    x.textAlign='center';x.fillStyle='#ffffff';x.font='600 30px "Atkinson Hyperlegible", Arial';x.fillText('ENGLISH SPEAKING & LISTENING  ·  CLB 4–5',W/2,140);
    x.fillStyle='#4cc3cc';x.font='800 42px "Bricolage Grotesque", Georgia';x.fillText('Personality · Appearance · Casting',W/2,196);
    x.fillStyle='#087e8b';x.font='800 92px "Bricolage Grotesque", Georgia';x.fillText('Certificate of Completion',W/2,350);
    x.fillStyle='#56697a';x.font='32px "Atkinson Hyperlegible", Arial';x.fillText('This certifies that',W/2,430);
    var nm=(S.name||'').trim()||'Student Name';var fs=110;x.font='800 '+fs+'px "Bricolage Grotesque", Georgia';while(x.measureText(nm).width>W-300&&fs>40){fs-=6;x.font='800 '+fs+'px "Bricolage Grotesque", Georgia'}
    x.fillStyle='#17324d';x.fillText(nm,W/2,560);
    x.strokeStyle='#e7aa38';x.lineWidth=4;x.beginPath();x.moveTo(W/2-420,595);x.lineTo(W/2+420,595);x.stroke();
    x.fillStyle='#17324d';x.font='34px "Atkinson Hyperlegible", Arial';x.fillText('has completed the lesson',W/2,660);
    x.font='700 46px "Atkinson Hyperlegible", Arial';x.fillText('Describing People',W/2,725);
    x.fillStyle='#56697a';x.font='28px "Atkinson Hyperlegible", Arial';x.fillText('Personality words  ·  Physical appearance  ·  Movie casting team',W/2,785);
    x.fillStyle='#087e8b';x.font='700 30px "Atkinson Hyperlegible", Arial';x.fillText('Listening score: '+score('t2q')+'/6  ·  '+score('hw3')+'/6  ·  '+score('find')+'/6',W/2,850);
    x.fillStyle='#17324d';x.font='700 32px "Atkinson Hyperlegible", Arial';x.textAlign='left';x.fillText(S.certDate||today,200,985);
    x.strokeStyle='#17324d';x.lineWidth=2;x.beginPath();x.moveTo(200,1000);x.lineTo(620,1000);x.stroke();
    x.font='24px "Atkinson Hyperlegible", Arial';x.fillStyle='#56697a';x.fillText('Date',200,1035);
    x.textAlign='right';x.beginPath();x.moveTo(W-620,1000);x.lineTo(W-200,1000);x.stroke();x.fillText('Teacher',W-200,1035);
    var u=c.toDataURL('image/png');$('#certImg').src=u;$('#dl').href=u;}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(drawCert);
  $('#work').onclick=function(){var b=this,msg=$('#wmsg');b.disabled=true;msg.textContent='Preparing your file…';
    buildWork($('#certImg').src).then(function(w){var u=URL.createObjectURL(w.blob),a=document.createElement('a');a.href=u;a.download=((S.name||'student').trim().replace(/[^A-Za-z0-9]+/g,'_')||'student')+'_Describing_People_work.html';document.body.appendChild(a);a.click();a.remove();
      msg.textContent='Downloaded: your answers and '+w.nrec+' recording'+(w.nrec===1?'':'s')+'. Look in your Downloads folder.';b.disabled=false;setTimeout(function(){URL.revokeObjectURL(u)},60000)},function(){msg.textContent='Something went wrong. Please try again.';b.disabled=false})};
  $$('#cn,#cd',m).forEach(function(i){i.addEventListener('input',drawCert)});}}
];
function score(k){var s=S[k];return s?s.res.filter(function(x){return x===true}).length:0}

/* ---------- shell ---------- */
var CANS=[],SUB=null,SAY=null,cur=Math.min(S.cur||0,screens.length-1);
function bindInputs(root){$$('[data-k]',root).forEach(function(el){if(S[el.dataset.k]!=null)el.value=S[el.dataset.k];el.addEventListener('input',function(){S[el.dataset.k]=el.value;save()})})}
function wire(root){$$('[data-say]',root).forEach(function(b){b.onclick=function(){var t=SAY&&SAY(b.dataset.say);if(!t)return;var vm=b.closest('.vm');if(vm){vm.classList.add('playing');setTimeout(function(){vm.classList.remove('playing')},14000)}speak(t,b)}})}
function go(i){try{speechSynthesis.cancel()}catch(e){}cur=Math.max(0,Math.min(screens.length-1,i));S.cur=cur;save();render();scrollTo(0,0)}
function render(){SAY=null;SUB=null;var sc=screens[cur],m=$('#app');m.innerHTML='';var d=document.createElement('div');d.className='screen';m.appendChild(d);sc.draw(d);bindInputs(d);wire(d);wireAB(d);
  $('#tLabel').textContent=sc.t;$('#tCount').textContent='Step '+(cur+1)+' of '+screens.length;$('#fill').style.width=((cur+1)/screens.length*100)+'%';
  navLabel();}
function navLabel(){var sub=SUB&&SUB.more();$('#back').disabled=cur===0&&!(SUB&&SUB.canBack());$('#next').textContent=sub?SUB.word():(cur===screens.length-1?'Back to start':(cur===0?'Start':'Next task'));}
$('#back').onclick=function(){if(SUB&&SUB.canBack()){SUB.back();navLabel();return}go(cur-1)};
$('#next').onclick=function(){if(SUB&&SUB.more()){SUB.next();navLabel();return}go(cur===screens.length-1?0:cur+1)};
new MutationObserver(function(){if(typeof navLabel==='function')navLabel()}).observe($('#app'),{childList:true,subtree:true});
function applySlow(){var b=$('#slow');if(b)b.setAttribute('aria-pressed',!!S.slow);$$('audio').forEach(function(a){a.playbackRate=S.slow?.75:1})}
document.addEventListener('play',function(e){if(e.target&&e.target.tagName==='AUDIO')e.target.playbackRate=S.slow?.75:1},true);
$('#slow').onclick=function(){S.slow=!S.slow;save();applySlow()};applySlow();
render();
})();
</script>
