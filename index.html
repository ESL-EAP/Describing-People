<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last Call</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one lesson screen at a time; top progress bar, bottom Back/Next */
:root{
  --bg:#eef4f6; --surface:#ffffff; --ink:#17324d; --muted:#56697a; --line:#cfdde5;
  --accent:#087e8b; --accent-soft:#dff1f2; --on-accent:#ffffff;
  --good:#1f8a4c; --good-soft:#e1f4e8; --bad:#b4472f; --bad-soft:#fbe7e2;
  --warm:#fff4dc; --warm-line:#e7aa38; --night:#17324d; --on-night:#f2f7f9;
  --display:"Bricolage Grotesque",Georgia,serif; --body:"Atkinson Hyperlegible",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1820; --surface:#16242f; --ink:#e4eef3; --muted:#9db1bf; --line:#2b3f4d;
  --accent:#4cc3cc; --accent-soft:#143a40; --on-accent:#06232a;
  --good:#5fd38f; --good-soft:#14361f; --bad:#f08a72; --bad-soft:#3b1d16;
  --warm:#33290f; --warm-line:#d39a2c; --night:#0a1218; --on-night:#e4eef3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1820; --surface:#16242f; --ink:#e4eef3; --muted:#9db1bf; --line:#2b3f4d;
  --accent:#4cc3cc; --accent-soft:#143a40; --on-accent:#06232a;
  --good:#5fd38f; --good-soft:#14361f; --bad:#f08a72; --bad-soft:#3b1d16;
  --warm:#33290f; --warm-line:#d39a2c; --night:#0a1218; --on-night:#e4eef3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:18px/1.5 var(--body);margin:0}
.wrap{max-width:900px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:800}
h3{font-size:1.2rem;font-weight:600}
p{margin:0;max-width:66ch}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:700;font-size:.9rem;color:var(--muted)}
.top .task{color:var(--accent);letter-spacing:.1em;text-transform:uppercase;font-size:.78rem}
.track{height:8px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.screen{display:grid;gap:18px;padding-top:14px;animation:in .3s ease}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
.lead{font-size:1.1rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer}
.chip{font-weight:700;padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn{font-weight:700;padding:12px 22px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);min-height:48px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.listen{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;padding:14px 22px;border-radius:999px;border:0;background:var(--night);color:var(--on-night)}
.listen svg{width:22px;height:22px;fill:currentColor}
.listen.playing{background:var(--accent);color:var(--on-accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
label{font-weight:700;display:block;margin-bottom:6px}
.fb{border-radius:12px;padding:12px 16px;font-weight:700}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .script{display:block;font-weight:400;color:var(--ink);font-style:italic;margin-top:4px}
.phr{background:var(--accent-soft);border-radius:12px;padding:12px 16px}
.phr b{display:block;margin-bottom:2px}
.note{background:var(--warm);border-left:5px solid var(--warm-line);padding:12px 16px;border-radius:6px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--surface)}
.dot.on{border-color:var(--accent);color:var(--accent)}
.dot.ok{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.flip{perspective:900px;min-height:120px;border:0;padding:0;background:none;text-align:center}
.flip .in{position:relative;display:block;min-height:120px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;display:grid;place-items:center;padding:12px;border-radius:14px;backface-visibility:hidden;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.flip .f{font-family:var(--display);font-size:1.6rem;font-weight:800}
.flip .b{transform:rotateY(180deg);background:var(--accent-soft)}
.flip .b small{display:block;color:var(--muted);font-size:.8rem;margin-top:6px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.qcard{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:16px;display:grid;gap:4px}
.qcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qcard b{font-size:1.05rem}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ph{border:3px solid transparent;border-radius:12px;padding:0;background:var(--surface);overflow:hidden;position:relative;color:var(--ink)}
.ph img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.ph span{position:absolute;left:6px;top:6px;background:var(--night);color:var(--on-night);font-weight:800;border-radius:8px;padding:2px 9px}
.ph.good{border-color:var(--good)} .ph.bad{border-color:var(--bad);opacity:.55}
.ph.sel{border-color:var(--accent)}
.sentence{font-size:1.25rem;line-height:2.1}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--accent);text-align:center;font-weight:800;color:var(--accent);padding:0 6px}
.actorview{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:18px;align-items:start}
.actorview img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;display:block}
@media (max-width:640px){.actorview{grid-template-columns:1fr}.actorview img{max-width:300px}}
audio{width:100%}
.story{background:var(--night);color:var(--on-night);border-radius:16px;padding:24px;display:grid;gap:12px}
.story .time{font-family:var(--display);font-size:clamp(2.6rem,9vw,4rem);font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.story blockquote{margin:0;font-size:1.3rem;font-style:italic}
.vm{display:flex;align-items:center;gap:12px}
.vm .wave{display:flex;gap:3px;align-items:center;height:28px}
.vm .wave i{width:4px;background:var(--accent);border-radius:2px;height:30%}
.vm.playing .wave i{animation:w .9s ease-in-out infinite}
.vm .wave i:nth-child(2n){animation-delay:.15s}.vm .wave i:nth-child(3n){animation-delay:.3s}
@keyframes w{50%{height:100%}}
.role{display:grid;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:66px;padding:0;border:3px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);color:var(--ink);font-size:.75rem;font-weight:700}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.thumb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.thumb.used{opacity:.45}
.score{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--accent);line-height:1}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav .in{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;gap:10px}
.menu{display:grid;gap:8px}
.menu button{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px}
.small{font-size:.9rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top" id="top"><div class="row"><span class="task" id="tLabel"></span><span id="tCount"></span></div><div class="track"><div class="fill" id="fill"></div></div></div>
  <main id="app" aria-live="polite"></main>
</div>
<div class="nav"><div class="in"><button class="btn ghost" id="back" type="button">Back</button><button class="btn" id="next" type="button">Next</button></div></div>

<script>
(function(){
var KEY='lastcall-lesson-v2', S={};
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>';

/* ---------- speech ---------- */
var hasTTS='speechSynthesis' in window;
function speak(text,btn){
  if(!hasTTS){alertBox(btn,text);return}
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='en-CA';u.rate=.85;
    var v=speechSynthesis.getVoices().filter(function(x){return /^en/.test(x.lang)});
    var pref=v.filter(function(x){return /Google|Natural|Samantha|Jenny|Aria/.test(x.name)})[0]||v[0]; if(pref)u.voice=pref;
    if(btn){btn.classList.add('playing');u.onend=u.onerror=function(){btn.classList.remove('playing')}}
    speechSynthesis.speak(u)}catch(e){alertBox(btn,text)}
}
function alertBox(btn,text){var n=btn&&btn.nextElementSibling;if(n&&n.classList.contains('tts-fallback')){n.hidden=false;n.textContent='Audio is not available on this device. Ask your teacher to read it.'}}
if(hasTTS){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){}}catch(e){}}
function listenBtn(id,label){return '<div><button type="button" class="listen" data-say="'+id+'">'+PLAY+(label||'Listen')+'</button><p class="small tts-fallback" hidden></p></div>'}

/* ---------- data ---------- */
var A=[
 {n:'Alex',f:'actor_01_alex',len:'short',tex:['curly'],gl:true,wear:'a green jacket'},
 {n:'Mina',f:'actor_02_mina',len:'long',tex:['straight'],gl:false,wear:'a blue sweater'},
 {n:'Jordan',f:'actor_03_jordan',len:'short',tex:['straight','wavy'],gl:false,wear:'a red jacket'},
 {n:'Priya',f:'actor_04_priya',len:'long',tex:['curly'],gl:false,wear:'a yellow scarf'},
 {n:'Ben',f:'actor_05_ben',len:'short',tex:['straight'],gl:false,wear:'a grey shirt'},
 {n:'Taylor',f:'actor_06_taylor',len:'long',tex:['curly'],gl:false,wear:'a black jacket'},
 {n:'Sam',f:'actor_07_sam',len:'short',tex:['wavy','curly'],gl:false,wear:'a striped shirt'}];
function img(a){return 'images/'+a.f+'.jpg'}
var SIT=[
 {s:'A new student arrives. Mia smiles, says hello, and invites the student to sit with her group.',o:['friendly','rude','quiet'],a:'friendly',name:'Mia'},
 {s:'Omar sees that a classmate is carrying many books. He offers to carry some of them.',o:['helpful','impatient','talkative'],a:'helpful',name:'Omar'},
 {s:'When Kim is speaking, Alex interrupts and says, “That’s a silly idea.”',o:['rude','friendly','helpful'],a:'rude',name:'Alex'},
 {s:'The line is moving slowly. Pat sighs, checks the time, and complains about waiting.',o:['impatient','quiet','friendly'],a:'impatient',name:'Pat'},
 {s:'In the group discussion, Jamie listens carefully. Jamie shares one short idea and then listens again.',o:['quiet','talkative','rude'],a:'quiet',name:'Jamie'},
 {s:'During the group discussion, Taylor shares many ideas and speaks for a long time.',o:['talkative','impatient','quiet'],a:'talkative',name:'Taylor'}];
var FIND=[
 {s:'I’m looking for someone with short, curly hair and glasses. They are wearing a green jacket.',a:0},
 {s:'Please find someone with long, straight hair. They are wearing a blue sweater.',a:1},
 {s:'Can you see someone with short hair? They are wearing a striped shirt.',a:6},
 {s:'I’m looking for someone with curly hair. They are wearing a yellow scarf.',a:3},
 {s:'Please find someone with long, curly hair. They are wearing a black jacket.',a:5},
 {s:'Can you see someone with short hair? They are wearing a red jacket and holding a microphone.',a:2}];
var BUILD=[1,0,5,6];
var HASW=[['Mina ___ long, straight hair.','has'],['Jordan ___ a red jacket.','is wearing'],['Alex ___ glasses.','has'],['Sam ___ a striped shirt.','is wearing']];
var ROLES=[
 {r:'Investigative Journalist',d:'Asks direct questions, talks to many people, and keeps looking when answers are difficult.'},
 {r:'Researcher',d:'Listens closely, checks information carefully, and notices small details in clues.'},
 {r:'Podcast Host',d:'Speaks clearly and confidently, explains information, and keeps listeners interested.'},
 {r:'Local Contact',d:'Welcomes the journalist, builds trust, knows the area, and offers practical help.'},
 {r:'Skeptical Witness',d:'Stays calm, asks for proof, and does not believe a story immediately.'}];
var RQ=[['This person asks for proof and does not believe a story immediately.',4],['This person checks information carefully and notices small details.',1],['This person welcomes visitors and offers practical help.',3],['This person speaks clearly and keeps listeners interested.',2],['This person asks direct questions and keeps looking for answers.',0]];
var TRAITS=['friendly','helpful','rude','impatient','quiet','talkative','confident','patient','careful','curious'];
var VOCAB=[['friendly','kind and welcoming','positive'],['helpful','ready to help','positive'],['rude','not polite or kind','negative'],['impatient','gets annoyed when waiting','negative'],['quiet','does not speak much','depends'],['talkative','speaks a lot','depends']];
var STORY='At eleven forty-seven p.m., a journalist receives a voicemail from a person who disappeared ten years ago. The message gives one clue and says: Don’t trust the person who finds me first. The journalist has until morning to find out who sent the message.';

/* ---------- reusable: one-at-a-time quiz ---------- */
function quiz(key,items,renderQ,check,onDone){
  S[key]=S[key]||{i:0,res:[]}; var st=S[key];
  return function(root){
    function draw(){
      var dots='<div class="dots">'+items.map(function(_,k){var c=st.res[k]===true?'ok':(k===st.i?'on':'');return '<span class="dot '+c+'">'+(k+1)+'</span>'}).join('')+'</div>';
      if(st.i>=items.length){var sc=st.res.filter(function(x){return x===true}).length;
        root.innerHTML=dots+'<div class="card" style="display:grid;gap:10px"><span class="score">'+sc+' / '+items.length+'</span><p>First-try correct answers. '+(sc===items.length?'Excellent work!':'Good job. You can try again to practise.')+'</p><div><button class="btn ghost" type="button" data-redo>Try again</button></div></div>'+(onDone?onDone():'');
        $('[data-redo]',root).onclick=function(){st.i=0;st.res=[];st.tries={};save();draw()};wire(root);return}
      root.innerHTML=dots+renderQ(items[st.i],st.i)+'<div data-fb></div>';
      wire(root);
      $$('[data-ans]',root).forEach(function(b){b.onclick=function(){
        st.tries=st.tries||{};var first=!st.tries[st.i];st.tries[st.i]=1;
        var r=check(items[st.i],b.getAttribute('data-ans'));var fb=$('[data-fb]',root);
        if(r.ok){if(first&&st.res[st.i]===undefined)st.res[st.i]=true;else if(st.res[st.i]===undefined)st.res[st.i]=false;
          b.classList.add('good');$$('[data-ans]',root).forEach(function(x){x.disabled=true});
          fb.innerHTML='<div class="fb good">'+r.msg+(r.script?'<span class="script">'+esc(r.script)+'</span>':'')+'</div><div style="margin-top:10px"><button class="btn" type="button" data-nextq>'+(st.i<items.length-1?'Next question':'See my score')+'</button></div>';
          $('[data-nextq]',root).onclick=function(){st.i++;save();draw()};
        }else{if(st.res[st.i]===undefined)st.res[st.i]=false;b.classList.add('bad');b.disabled=true;fb.innerHTML='<div class="fb bad">'+r.msg+'</div>'}
        save();}});
    }
    draw();
  };
}

/* ---------- screens ---------- */
var screens=[
{t:'Welcome',draw:function(m){m.innerHTML='<div class="card" style="display:grid;gap:14px"><div class="small" style="font-weight:700;color:var(--accent)">English speaking &amp; listening · CLB 4–5</div><h1>First Impressions<br>&amp; The Last Call</h1><p class="lead">Listen, notice, describe, and cast a mystery movie.</p><div><label for="sname">What is your name?</label><input type="text" id="sname" data-k="name" autocomplete="name"></div><p class="small">Use headphones if you can. Your answers save in this browser. Press <b>Next</b> to start.</p></div><div class="card"><h3 style="margin-bottom:10px">Jump to a task</h3><div class="menu" id="menu"></div></div>';
  var tasks=[['Task 1 · First impressions',1],['Task 2 · Personality words',3],['Task 3 · Describing people',6],['Task 4 · The Last Call',9],['Certificate',14]];
  $('#menu').innerHTML=tasks.map(function(t){return '<button type="button" data-go="'+t[1]+'"><b>'+t[0]+'</b><span aria-hidden="true">→</span></button>'}).join('');
  $$('[data-go]').forEach(function(b){b.onclick=function(){go(+b.getAttribute('data-go'))}});}},

{t:'Task 1 · First impressions',draw:function(m){
  m.innerHTML='<h2>What do you notice first?</h2><p class="lead">When you meet someone for the first time, what do you notice? Tap one.</p><div class="chips" id="poll"></div><div id="pollOut"></div><div class="card" style="display:grid;gap:10px"><h3>Quick check</h3><p>Is a first impression always correct?</p><div class="chips"><button class="chip" type="button" data-fi="yes">Yes</button><button class="chip" type="button" data-fi="no">No</button></div><div id="fiOut"></div></div>';
  var opts=['their clothes','their smile','their voice','their hair','their eyes','something else'];
  function out(){$('#poll').innerHTML=opts.map(function(o){return '<button type="button" class="chip" aria-pressed="'+(S.poll===o)+'" data-v="'+o+'">'+o+'</button>'}).join('');
    $('#pollOut').innerHTML=S.poll?'<div class="phr"><b>Say it to your partner:</b>“I notice '+esc(S.poll==='something else'?'_____':S.poll)+' first.”</div>':'';
    $$('#poll .chip').forEach(function(b){b.onclick=function(){S.poll=b.dataset.v;save();out()}})}
  out();
  $$('[data-fi]').forEach(function(b){b.onclick=function(){$$('[data-fi]').forEach(function(x){x.className='chip'});var ok=b.dataset.fi==='no';b.classList.add(ok?'good':'bad');$('#fiOut').innerHTML='<div class="fb '+(ok?'good':'bad')+'">'+(ok?'Right! A first impression is only a guess. We learn more when we talk to someone.':'Not always. A first impression is only a guess.')+'</div>'}});}},

{t:'Task 1 · First impressions',draw:function(m){
  var Q=[['When you meet someone for the first time, what do you notice?','Their clothes? Their smile? Their voice?'],['Can you guess someone’s personality from how they look?','Why or why not?'],['Have you ever had the wrong first impression of someone?','What happened? You can talk about a person in a book, film, or TV show.'],['Can someone look shy but be friendly?','Can you think of another example?']];
  S.q2=S.q2||[];
  function draw(){m.innerHTML='<h2>Talk with a partner</h2><p class="lead">Tap <b>two</b> questions to discuss. You may pass on a personal question. ('+S.q2.length+' / 2 chosen)</p><div class="grid2">'+Q.map(function(q,i){return '<button type="button" class="qcard" data-q="'+i+'" aria-pressed="'+(S.q2.indexOf(i)>-1)+'"><b>'+(i+1)+'. '+q[0]+'</b><span class="small">'+q[1]+'</span></button>'}).join('')+'</div>'+
    (S.q2.length===2?'<div class="phr"><b>Helpful phrases</b>I notice ___ first. · I think ___ because ___. · Sometimes, but ___. · I once thought ___, but then ___. · For example, ___. · I agree. / I’m not sure I agree.</div><div><label for="t1n">My notes (optional)</label><textarea id="t1n" data-k="t1notes"></textarea></div>':'');
    $$('[data-q]',m).forEach(function(b){b.onclick=function(){var i=+b.dataset.q,k=S.q2.indexOf(i);if(k>-1)S.q2.splice(k,1);else{if(S.q2.length===2)S.q2.shift();S.q2.push(i)}save();draw()}});bindInputs(m)}

  $('#tLabel').textContent=sc.t;$('#tCount').textContent='Step '+(cur+1)+' of '+screens.length;$('#fill').style.width=((cur+1)/screens.length*100)+'%';
